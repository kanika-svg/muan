<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var KEY = 'muan-theme';
        var saved = localStorage.getItem(KEY);
        var theme = saved || (window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      window.__bootStart = performance.now();
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paisaidee — what's on in Vientiane</title>
  <meta name="description" content="Paisaidee (ມ່ວນ) — live map of bars, cafes and events in Vientiane. ຄືນນີ້ໄປໃສດີ?">
  <meta name="theme-color" content="#131019">

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: #131019;
      transition: opacity .45s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .splash-inner { text-align: center; animation: splash-in .5s ease backwards; }
    .splash-flame { animation: splash-pulse 1.6s ease-in-out infinite; }
    .splash-flame path { fill: #FF5A3C; }
    .splash-word {
      margin-top: 14px; font-size: 15px; font-weight: 700; letter-spacing: 3px;
      color: #F5F1E8; font-family: system-ui, sans-serif;
    }
    @keyframes splash-in { from { opacity:0; transform: translateY(8px) } }
    @keyframes splash-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @media (prefers-reduced-motion: reduce) {
      .splash-inner, .splash-flame { animation: none; }
    }

    [data-theme="light"] #splash { background: #FFFCF5; }
    [data-theme="light"] .splash-word { color: #2A2419; }
    [data-theme="light"] .splash-flame path { fill: #D93A1F; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <svg class="splash-flame" width="72" height="88" viewBox="0 0 72 88">
      <path d="M36 4 C18 4 6 17 6 33 C6 52 26 70 36 84 C46 70 66 52 66 33 C66 17 54 4 36 4 Z" fill="#FF5A3C"/>
    </svg>
    <div class="splash-word">PAISAIDEE</div>
  </div>
</div>
<div id="app">

  <div id="map"></div>

  <header id="topbar">
    <div class="row">
      <div class="pill brand-pill">
        <img src="assets/logo.svg" alt="" width="15" height="18">
        <span class="brand">PAISAIDEE</span>
      </div>
      <button class="pill" id="locateBtn" aria-label="Show my location">
        <span id="locateIcon">📍</span><span id="locateLabel">near me</span>
        <span id="geoHint" class="geo-hint" hidden>Location is blocked for this site — re-enable it in your browser's site settings.</span>
      </button>
      <button class="pill" id="themeBtn" aria-label="Switch theme">
        <span id="themeLabel">auto</span>
      </button>
      <button class="pill" id="avatarBtn" aria-label="Choose your avatar"><span id="avatarSlot">😊</span></button>
    </div>
    <div class="chip-bar" id="chipBar">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="bar">Bars</button>
      <button class="chip" data-filter="cafe">Cafes</button>
      <button class="chip" data-filter="event">Events</button>
    </div>
  </header>

  <button id="sheetToggle" aria-label="Show or hide the list">‹</button>
  <section id="sheet" aria-live="polite"></section>

</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
