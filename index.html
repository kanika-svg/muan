<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var KEY = 'muan-theme';
        var saved = localStorage.getItem(KEY);
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      window.__bootStart = performance.now();
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paisaidee — what's on in Vientiane</title>
  <meta name="description" content="Paisaidee (ມ່ວນ) — live map of bars, cafes and events in Vientiane. ຄືນນີ້ໄປໃສດີ?">
  <meta name="theme-color" content="#131019">

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: #131019;
      transition: opacity .45s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .splash-inner { text-align: center; animation: splash-in .5s ease backwards; }
    .splash-loader { width: 72px; height: 72px; margin: 0 auto; color: #FF5A3C; }
    .splash-loader svg { display: block; width: 100%; height: 100%; }
    .splash-word {
      margin-top: 14px; font-size: 15px; font-weight: 700; letter-spacing: 3px;
      color: #F5F1E8; font-family: system-ui, sans-serif;
    }
    @keyframes splash-in { from { opacity:0; transform: translateY(8px) } }
    @media (prefers-reduced-motion: reduce) {
      .splash-inner { animation: none; }
    }

    [data-theme="light"] #splash { background: #FFFCF5; }
    [data-theme="light"] .splash-word { color: #2A2419; }
    [data-theme="light"] .splash-loader { color: #E8462A; }

    /* flame-coloured expanding ring — duplicated from .lring/.lring-arc in
       css/style.css (see loadingRing() in js/app.js) so the splash paints
       before that stylesheet or app.js are guaranteed to have run, same
       reason every other splash rule above is self-contained rather than
       relying on the external sheet. CSS animations (unlike the SMIL loader
       this replaced) already respect prefers-reduced-motion on their own —
       no imperative pause script needed here. */
    .lring { animation: lring-spin 1.1s linear infinite; transform-origin: 50% 50%; }
    .lring-arc { animation: lring-sweep 1.4s ease-in-out infinite; }
    @keyframes lring-spin { to { transform: rotate(360deg); } }
    @keyframes lring-sweep {
      0%   { stroke-dashoffset: 100; }
      50%  { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 100; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lring, .lring-arc { animation: none; }
      .lring-arc { stroke-dashoffset: 60; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="splash-loader" aria-hidden="true"><svg class="lring" width="72" height="72" viewBox="0 0 44 44" aria-hidden="true">
      <circle class="lring-track" cx="22" cy="22" r="18" fill="none"
              stroke="currentColor" stroke-width="3" opacity=".16"/>
      <circle class="lring-arc" cx="22" cy="22" r="18" fill="none"
              stroke="currentColor" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="113" stroke-dashoffset="85"/>
    </svg></div>
    <div class="splash-word">PAISAIDEE</div>
  </div>
</div>
<div id="app">

  <div id="map"></div>

  <header id="topbar">
    <div class="row">
      <div class="pill brand-pill">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-words">
            <span class="brand-lo lao">ໄປໃສດີ</span>
            <span class="brand-en">PAISAIDEE</span>
          </span>
        </div>
      </div>
      <button class="pill" id="locateBtn" aria-label="Show my location">
        <span id="locateIcon"></span><span id="locateLabel">near me</span>
      </button>
      <button class="pill" id="themeBtn" aria-label="Switch theme">
        <span id="themeIcon"></span><span id="themeLabel" class="pill-label">auto</span>
      </button>
      <button class="pill" id="avatarBtn" aria-label="Choose your avatar"><span id="avatarSlot">😊</span></button>
    </div>
    <div class="chip-bar" id="chipBar">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="bar">Bars</button>
      <button class="chip" data-filter="cafe">Cafes</button>
      <button class="chip" data-filter="event">Events</button>
    </div>
  </header>

  <div id="routeBar" hidden role="button" tabindex="0" aria-label="Route showing — tap to re-frame the map">
    <span id="routeBarLabel"></span>
    <button id="routeBarClose" aria-label="Hide route">✕</button>
  </div>
  <button id="sheetToggle" aria-label="Show or hide the list">‹</button>
  <section id="sheet" aria-live="polite">
    <div id="sheetTopCover" aria-hidden="true"></div>
    <div id="sheetHandle" aria-hidden="true"></div>
    <div id="mapWarning" class="map-warning" hidden>
      <span>Map tiles didn't load — check your connection. The list still works.</span>
      <button id="mapWarningClose" aria-label="Dismiss">✕</button>
    </div>
    <div id="staleWarning" class="map-warning" hidden>
      <span>Showing saved venue data — some details may be out of date.</span>
      <button id="staleWarningClose" aria-label="Dismiss">✕</button>
    </div>
    <div id="sheetInner"></div>
  </section>

  <nav id="bottomNav" aria-label="Screens">
    <button class="nav-item" data-nav="home" aria-label="Home">
      <span class="nav-ico" id="navHomeIcon" aria-hidden="true"></span><span>Home</span>
    </button>
    <button class="nav-item" data-nav="map" aria-label="Map">
      <span class="nav-ico" id="navMapIcon" aria-hidden="true"></span><span>Map</span>
    </button>
    <button class="nav-item" data-nav="you" aria-label="You">
      <span class="nav-ico" id="navYouIcon" aria-hidden="true"></span><span>You</span>
    </button>
  </nav>

</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
