<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var KEY = 'muan-theme';
        var saved = localStorage.getItem(KEY);
        var theme = saved || (window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      window.__bootStart = performance.now();
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paisaidee — what's on in Vientiane</title>
  <meta name="description" content="Paisaidee (ມ່ວນ) — live map of bars, cafes and events in Vientiane. ຄືນນີ້ໄປໃສດີ?">
  <meta name="theme-color" content="#131019">

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: #131019;
      transition: opacity .45s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .splash-inner { text-align: center; animation: splash-in .5s ease backwards; }
    .splash-loader { width: 72px; height: 72px; margin: 0 auto; }
    .splash-loader svg { display: block; width: 100%; height: 100%; }
    .splash-word {
      margin-top: 14px; font-size: 15px; font-weight: 700; letter-spacing: 3px;
      color: #F5F1E8; font-family: system-ui, sans-serif;
    }
    @keyframes splash-in { from { opacity:0; transform: translateY(8px) } }
    @media (prefers-reduced-motion: reduce) {
      .splash-inner { animation: none; }
    }

    [data-theme="light"] #splash { background: #FFFCF5; }
    [data-theme="light"] .splash-word { color: #2A2419; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="splash-loader" aria-hidden="true"><svg fill="none" height="100%" width="100%" viewBox="0 0 500 500" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg"><g id="i0"><g transform="translate(290,250)"><animateTransform repeatCount="indefinite" type="translate" attributeName="transform" dur="1.367s" begin="0s" calcMode="spline" values="290 270; 290 270; 290 250; 290 250" keyTimes="0; 0.195122; 0.682927; 1" keySplines="0 0 1 1; 0.333 0 0.667 1; 0 0 1 1" fill="freeze" /><g transform="scale(1,1)"><animateTransform repeatCount="indefinite" type="scale" attributeName="transform" dur="1.367s" begin="0s" calcMode="spline" values="0.7 0.7; 0.7 0.7; 1 1; 1 1" keyTimes="0; 0.195122; 0.682927; 1" keySplines="0 0 1 1; 0.333 0 0.667 1; 0 0 1 1" fill="freeze" /><g transform="translate(0,0)"><g id="i1"><ellipse ry="10" rx="10" cy="0" cx="0" stroke-width="0" stroke="#e8e8e8" fill="#9babc6" /></g></g></g></g></g><g id="i2"><g transform="translate(250,250)"><animateTransform repeatCount="indefinite" type="translate" attributeName="transform" dur="1.367s" begin="0s" calcMode="spline" values="250 270; 250 270; 250 250; 250 250" keyTimes="0; 0.097561; 0.585366; 1" keySplines="0 0 1 1; 0.333 0 0.667 1; 0 0 1 1" fill="freeze" /><g transform="scale(1,1)"><animateTransform repeatCount="indefinite" type="scale" attributeName="transform" dur="1.367s" begin="0s" calcMode="spline" values="0.7 0.7; 0.7 0.7; 1 1; 1 1" keyTimes="0; 0.097561; 0.585366; 1" keySplines="0 0 1 1; 0.333 0 0.667 1; 0 0 1 1" fill="freeze" /><g transform="translate(0,0)"><g id="i1"><ellipse ry="10" rx="10" cy="0" cx="0" stroke-width="0" stroke="#e8e8e8" fill="#9babc6" /></g></g></g></g></g><g id="i3"><g transform="translate(210,250)"><animateTransform repeatCount="indefinite" type="translate" attributeName="transform" dur="1.367s" begin="0s" calcMode="spline" values="210 270; 210 250; 210 250" keyTimes="0; 0.487805; 1" keySplines="0.333 0 0.667 1; 0 0 1 1" fill="freeze" /><g transform="scale(1,1)"><animateTransform repeatCount="indefinite" type="scale" attributeName="transform" dur="1.367s" begin="0s" calcMode="spline" values="0.7 0.7; 1 1; 1 1" keyTimes="0; 0.487805; 1" keySplines="0.333 0 0.667 1; 0 0 1 1" fill="freeze" /><g transform="translate(0,0)"><g id="i1"><ellipse ry="10" rx="10" cy="0" cx="0" stroke-width="0" stroke="#e8e8e8" fill="#9babc6" /></g></g></g></g></g></svg></div>
    <div class="splash-word">PAISAIDEE</div>
  </div>
</div>
<script>
  // SMIL ignores prefers-reduced-motion (no CSS media-query hook for it),
  // so it has to be paused imperatively — inline and synchronous like the
  // theme-detection script above, so it runs before first paint with no
  // network wait
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelector('.splash-loader svg')?.pauseAnimations();
  }
</script>
<div id="app">

  <div id="map"></div>

  <header id="topbar">
    <div class="row">
      <div class="pill brand-pill">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-words">
            <span class="brand-lo lao">ໄປໃສດີ</span>
            <span class="brand-en">PAISAIDEE</span>
          </span>
        </div>
      </div>
      <button class="pill" id="locateBtn" aria-label="Show my location">
        <span id="locateIcon"></span><span id="locateLabel">near me</span>
      </button>
      <button class="pill" id="themeBtn" aria-label="Switch theme">
        <span id="themeIcon"></span><span id="themeLabel" class="pill-label">auto</span>
      </button>
      <button class="pill" id="avatarBtn" aria-label="Choose your avatar"><span id="avatarSlot">😊</span></button>
    </div>
    <div class="chip-bar" id="chipBar">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="bar">Bars</button>
      <button class="chip" data-filter="cafe">Cafes</button>
      <button class="chip" data-filter="event">Events</button>
    </div>
  </header>

  <div id="routeBar" hidden role="button" tabindex="0" aria-label="Route showing — tap to re-frame the map">
    <span id="routeBarLabel"></span>
    <button id="routeBarClose" aria-label="Hide route">✕</button>
  </div>
  <button id="sheetToggle" aria-label="Show or hide the list">‹</button>
  <section id="sheet" aria-live="polite">
    <div id="sheetHandle" aria-hidden="true"></div>
    <div id="mapWarning" class="map-warning" hidden>
      <span>Map tiles didn't load — check your connection. The list still works.</span>
      <button id="mapWarningClose" aria-label="Dismiss">✕</button>
    </div>
    <div id="sheetInner"></div>
  </section>

</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
